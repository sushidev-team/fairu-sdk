name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]
        # Laravel 10 and 11 are gone from this matrix, not because support was
        # dropped — composer.json still allows ^10.0|^11.0 — but because
        # Composer can no longer install them. Both lines are EOL and every
        # published release is flagged by unpatched security advisories, so
        # `composer update` aborts with "Your requirements could not be
        # resolved" before a single test runs. Keeping the legs would mean a
        # permanently red matrix that verifies nothing. Whether to also narrow
        # the composer.json constraints is a separate call.
        laravel: [12.*, 13.*]
        exclude:
          # Laravel 13 requires PHP >= 8.3
          - php: 8.2
            laravel: 13.*

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Install dependencies
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
        run: |
          composer config allow-plugins.pestphp/pest-plugin true
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/contracts:${{ matrix.laravel }}" "illuminate/cache:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: |
          rm -rf .phpunit.cache
          ./vendor/bin/pest --colors=always
